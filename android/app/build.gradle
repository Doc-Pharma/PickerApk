apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

// ── react-native-config: map build variants to .env files ────────────────────
project.ext.envConfigFiles = [
    devDebug    : ".env.dev",
    devRelease  : ".env.dev",
    prodDebug   : ".env.prod",
    prodRelease : ".env.prod",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
// ─────────────────────────────────────────────────────────────────────────────

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    namespace "com.fledgehealth.picker"
    compileSdkVersion 36

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "env"

    defaultConfig {
        applicationId "com.fledgehealth.picker"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"

        resValue "string", "app_name", "PickerApp"
        resValue "string", "build_config_package", "com.fledgehealth.picker"
    }

    productFlavors {
        dev {
            dimension "env"
            resValue "string", "app_name", "PickerApp Dev"
        }
        prod {
            dimension "env"
            resValue "string", "app_name", "PickerApp"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // 🔥 Replace with real keystore later
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    splits {
        abi {
            reset()
            enable true
            universalApk false
            include "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}